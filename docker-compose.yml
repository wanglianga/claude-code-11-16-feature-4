services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ccdev
      POSTGRES_PASSWORD: ccdev
      POSTGRES_DB: charging_settlement
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ccdev -d charging_settlement"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
      args:
        # 国内构建可传入镜像源，例如：
        # docker compose build --build-arg PIP_INDEX_URL=https://pypi.tuna.tsinghua.edu.cn/simple
        PIP_INDEX_URL: ""
    environment:
      DATABASE_URL: postgresql+psycopg2://ccdev:ccdev@db:5432/charging_settlement
      JWT_SECRET: change-me-in-production
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8077:8077"
    volumes:
      - originals:/app/data/originals

  frontend:
    build:
      context: ./frontend
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  pgdata:
  originals:
