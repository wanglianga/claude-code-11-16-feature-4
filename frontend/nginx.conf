server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA 路由回退
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API 与 FastAPI 自动文档反代到后端
    location /api/ {
        proxy_pass http://backend:8077;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location = /docs { proxy_pass http://backend:8077/docs; }
    location /openapi.json { proxy_pass http://backend:8077/openapi.json; }
}
